<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Biochemistry - الملخص المدمج</title>
    <!-- إضافة Font Awesome لجعل الأيقونات تعمل -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== BASE ===== */
        :root {
            --bg1: #0a0e1a;
            --bg2: #141e33;
            --bg3: #1a2a45;
            --primary: #00d4ff;
            --primary-dark: #0099cc;
            --accent: #facc15;
            --danger: #f87171;
            --success: #34d399;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #e8edf5;
            --muted: #94a3b8;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --glow: 0 0 30px rgba(0, 212, 255, 0.06);
            --radius: 16px;
            --header-bg: rgba(255, 255, 255, 0.03);
            --header-border: rgba(255, 255, 255, 0.04);
            --footer-border: rgba(255, 255, 255, 0.03);
            --table-header-bg: rgba(0, 212, 255, 0.08);
            --card-title-bg: rgba(0, 212, 255, 0.06);
            --highlight-bg: #facc15;
            --highlight-text: #0f172a;
        }

        [data-theme="light"] {
            --bg1: #f0f4f8;
            --bg2: #e2e8f0;
            --bg3: #cbd5e1;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.1);
            --text: #0f172a;
            --muted: #475569;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --glow: 0 0 30px rgba(0, 212, 255, 0.02);
            --header-bg: rgba(255, 255, 255, 0.7);
            --header-border: rgba(0, 0, 0, 0.04);
            --footer-border: rgba(0, 0, 0, 0.04);
            --table-header-bg: rgba(0, 212, 255, 0.12);
            --card-title-bg: rgba(0, 212, 255, 0.08);
            --highlight-bg: #facc15;
            --highlight-text: #0f172a;
        }

        .highlight-text {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 0 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, 'Cairo', sans-serif;
            background: linear-gradient(-45deg, var(--bg1), var(--bg2), var(--bg3), #0f1a2b);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            min-height: 100vh;
            color: var(--text);
            padding: 16px 8px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background 0.4s ease;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .app { max-width: 1100px; width: 100%; }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 16px 16px;
            background: var(--header-bg);
            border-radius: 20px;
            border: 1px solid var(--header-border);
            backdrop-filter: blur(4px);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 4px 25px rgba(0, 212, 255, 0.15);
            transition: color 0.3s ease;
        }
        [data-theme="light"] .header h1 { color: #0f172a; text-shadow: none; }
        .header h1 .highlight {
            background: linear-gradient(135deg, var(--primary), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 1.5px;
            font-size: 0.8rem;
            margin-top: 2px;
        }
        .header .creator {
            color: var(--muted);
            font-size: 0.75rem;
            margin-top: 4px;
        }
        .header .creator i { color: var(--danger); }
        .header .creator .name { color: var(--text); font-weight: 700; }
        .theme-toggle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }
        .theme-toggle:hover {
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.08);
            transform: scale(1.05);
        }
        [data-theme="light"] .theme-toggle {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.06);
        }
        [data-theme="light"] .theme-toggle:hover {
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.1);
        }

        /* ===== TABS ===== */
        .tabs-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
            justify-content: center;
        }
        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 8px 14px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            line-height: 1.3;
        }
        .tab-btn:hover { border-color: var(--primary); color: var(--text); }
        .tab-btn.active {
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.08);
            color: var(--primary);
        }
        .tab-btn .en { display: block; font-size: 0.7rem; }
        .tab-btn .ar { display: block; font-size: 0.55rem; opacity: 0.7; }

        /* ===== CARDS ===== */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow), var(--glow);
            padding: 18px 14px;
            margin-bottom: 16px;
            transition: background 0.3s ease, border 0.3s ease;
            display: none;
        }
        .card.active { display: block; }
        .card h2 {
            font-size: 1.3rem;
            color: var(--text);
            border-right: 4px solid var(--primary);
            padding-right: 12px;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .card h2 i { color: var(--accent); margin-left: 6px; }

        /* ===== SLIDES ===== */
        .slide-container {
            position: relative;
            min-height: 300px;
        }
        .slide {
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .slide.active { display: block; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateX(15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .slide-progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--muted);
        }
        .slide-progress .bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            margin: 0 12px;
            overflow: hidden;
        }
        .slide-progress .bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #818cf8);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .slide-progress .count {
            font-weight: 600;
            white-space: nowrap;
        }

        .slide-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }
        .slide-nav .btn-nav {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 80px;
            text-align: center;
        }
        .slide-nav .btn-nav:hover:not(:disabled) {
            background: rgba(0, 212, 255, 0.08);
            border-color: var(--primary);
        }
        .slide-nav .btn-nav:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .slide-nav .btn-nav.primary {
            background: var(--primary);
            color: #0a0e1a;
            border-color: var(--primary);
        }
        .slide-nav .btn-nav.primary:hover:not(:disabled) {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        [data-theme="light"] .slide-nav .btn-nav {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.06);
        }
        [data-theme="light"] .slide-nav .btn-nav:hover:not(:disabled) {
            background: rgba(0, 212, 255, 0.1);
        }

        /* ===== CARDS GRID ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
            margin-bottom: 8px;
        }

        .topic-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 14px 12px;
            transition: border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .topic-card:hover {
            border-color: var(--primary);
        }

        .topic-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--card-title-bg);
        }
        .topic-card .card-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--primary);
            line-height: 1.4;
            flex: 1;
        }
        .topic-card .card-title-ar {
            color: var(--muted);
            font-weight: 400;
            display: none;
        }
        .topic-card .card-title-ar.show {
            display: inline;
        }
        .topic-card .card-title-en {
            display: inline;
        }
        .topic-card .card-title-en.hidden {
            display: none;
        }

        .topic-card .translate-btn {
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 0.6rem;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
            margin-right: 8px;
        }
        .topic-card .translate-btn:hover {
            background: rgba(0, 212, 255, 0.18);
            border-color: var(--primary);
        }
        .topic-card .translate-btn.active {
            background: rgba(0, 212, 255, 0.18);
            border-color: var(--primary);
        }

        .topic-card .card-items {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }
        .topic-card .card-items li {
            padding: 4px 0 4px 0;
            line-height: 1.6;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        [data-theme="light"] .topic-card .card-items li {
            border-bottom-color: rgba(0, 0, 0, 0.04);
        }
        .topic-card .card-items li:last-child {
            border-bottom: none;
        }

        .topic-card .item-en {
            font-weight: 600;
            color: var(--text);
            font-size: 0.9rem;
            line-height: 1.6;
            display: block;
            text-align: left;
            direction: ltr;
        }
        .topic-card .item-ar {
            color: var(--muted);
            font-size: 0.82rem;
            line-height: 1.6;
            text-align: right;
            direction: rtl;
            display: none;
            margin-top: 2px;
            padding-right: 8px;
            border-right: 2px solid rgba(0, 212, 255, 0.2);
        }
        .topic-card .item-ar.show {
            display: block;
        }

        .topic-card .card-items.numbered {
            counter-reset: item-counter;
        }
        .topic-card .card-items.numbered li {
            padding-right: 28px;
            position: relative;
            counter-increment: item-counter;
        }
        .topic-card .card-items.numbered li::before {
            content: counter(item-counter) "-";
            position: absolute;
            right: 2px;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
        }
        .topic-card .card-items.simple li {
            padding-right: 0;
        }
        .topic-card .card-items.simple li::before {
            display: none;
        }

        /* ===== TABLES ===== */
        .info-table-wrap {
            overflow-x: auto;
            margin: 12px 0;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            grid-column: 1 / -1;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            min-width: 500px;
        }
        .info-table th {
            background: var(--table-header-bg);
            color: var(--primary);
            padding: 8px 6px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            font-weight: 700;
        }
        .info-table td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--card-border);
            vertical-align: top;
            line-height: 1.5;
        }
        .info-table tr:last-child td { border-bottom: none; }
        .info-table .ar-text {
            border-right: none;
            padding-right: 0;
            margin-top: 2px;
            font-size: 0.78rem;
            display: block;
            color: var(--muted);
        }
        .info-table .en-text { font-size: 0.85rem; }
        .info-table.two-col td {
            vertical-align: middle;
        }
        .info-table.two-col .col-header {
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            background: var(--table-header-bg);
        }

        @media (max-width: 600px) {
            .cards-grid { grid-template-columns: 1fr; }
            .info-table { font-size: 0.72rem; min-width: 350px; }
            .info-table th, .info-table td { padding: 4px 3px; }
            .topic-card .card-title { font-size: 0.85rem; }
            .topic-card .item-en { font-size: 0.85rem; }
            .topic-card .item-ar { font-size: 0.78rem; }
        }
        @media (min-width: 601px) and (max-width: 900px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 901px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 1200px) {
            .cards-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .footer-credit {
            text-align: center;
            color: rgba(255, 255, 255, 0.12);
            font-size: 0.7rem;
            margin-top: 24px;
            padding: 10px 0;
            border-top: 1px solid var(--footer-border);
        }
        [data-theme="light"] .footer-credit { color: rgba(0, 0, 0, 0.2); }
        .footer-credit i { color: var(--danger); margin: 0 4px; }
        .footer-credit .name { color: var(--primary); font-weight: 600; }

        @media (max-width: 768px) {
            body { padding: 8px 4px; }
            .header { padding: 12px 10px; }
            .header h1 { font-size: 1.4rem; }
            .header .sub { font-size: 0.7rem; }
            .header .creator { font-size: 0.65rem; }
            .theme-toggle { width: 36px; height: 36px; font-size: 1rem; }
            .tab-btn { padding: 6px 10px; font-size: 0.6rem; }
            .tab-btn .en { font-size: 0.6rem; }
            .tab-btn .ar { font-size: 0.5rem; }
            .card { padding: 14px 10px; }
            .card h2 { font-size: 1.1rem; padding-right: 8px; }
            .slide-nav .btn-nav { padding: 8px 12px; font-size: 0.8rem; min-width: 60px; }
            .topic-card { padding: 10px 10px; }
        }

        .topic-card.full-width {
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <div class="app">
        <div class="header">
            <div class="header-top">
                <div>
                    <h1>
                        <span class="highlight">Biochemistry</span>
                    </h1>
                    <div class="sub">Medical Biochemistry · الكيمياء الحيوية الطبية</div>
                    <div class="creator"><i class="fas fa-user-graduate"></i> Created by <span class="name">MR. YASSIN THARWAT</span></div>
                </div>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="تبديل الوضع">🌙</button>
            </div>
        </div>

        <div class="tabs-wrap" id="tabsContainer"></div>
        <div id="sectionsContainer"></div>
        <div class="footer-credit">
            <i class= Created by <span class="name">MR. YASSIN THARWAT</span> 
        </div>
    </div>

    <script>
        // ================================================================
        //  THEME
        // ================================================================
        let currentTheme = localStorage.getItem('theme') || 'dark';

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeToggle').textContent = theme === 'light' ? '🌙' : '☀️';
            localStorage.setItem('theme', theme);
            currentTheme = theme;
        }
        function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

        // ================================================================
        //  SLIDE SYSTEM
        // ================================================================
        let slideState = {};

        function initSlideState(partId, totalSlides) {
            slideState[partId] = { current: 0, total: totalSlides };
        }

        function renderSlide(partId, containerId) {
            const state = slideState[partId];
            if (!state) return;
            const container = document.getElementById(containerId);
            if (!container) return;
            const slides = container.querySelectorAll('.slide');
            slides.forEach((s, i) => {
                s.classList.toggle('active', i === state.current);
            });
            const progressBar = container.querySelector('.slide-progress .fill');
            const countSpan = container.querySelector('.slide-progress .count');
            if (progressBar) {
                const pct = ((state.current + 1) / state.total) * 100;
                progressBar.style.width = pct + '%';
            }
            if (countSpan) {
                countSpan.textContent = `${state.current + 1} / ${state.total}`;
            }
            const prevBtn = container.querySelector('.btn-nav.prev');
            const nextBtn = container.querySelector('.btn-nav.next');
            if (prevBtn) prevBtn.disabled = state.current === 0;
            if (nextBtn) nextBtn.disabled = state.current === state.total - 1;
        }

        function goToSlide(partId, containerId, index) {
            const state = slideState[partId];
            if (!state) return;
            if (index < 0) index = 0;
            if (index >= state.total) index = state.total - 1;
            state.current = index;
            renderSlide(partId, containerId);
        }

        // ================================================================
        //  HELPERS
        // ================================================================
        function createSlideHTML(title, cardsHTML) {
            return `
                    <div class="slide">
                        <h3 style="font-size:1.1rem; color:var(--primary); margin-bottom:12px; border-right:3px solid var(--primary); padding-right:10px;">${title}</h3>
                        <div class="cards-grid">${cardsHTML}</div>
                    </div>
                `;
        }

        function card(title, items, arTitle = '', hasTranslate = true) {
            const cardId = 'c' + Math.random().toString(36).substr(2, 8);
            const itemsHTML = items.map((item) => {
                const en = item.en || item;
                const ar = item.ar || '';
                return `
                    <li>
                        <span class="item-en">${en}</span>
                        <span class="item-ar">${ar}</span>
                    </li>
                `;
            }).join('');

            const listClass = items.some(i => i.en && i.en.match(/^\d/)) ? 'card-items numbered' : 'card-items simple';

            const translateBtn = hasTranslate ? `<button class="translate-btn" data-card="${cardId}" onclick="toggleCardTranslation('${cardId}')">📖 ترجمة هذا الجزء</button>` : '';

            return `
                <div class="topic-card" data-card="${cardId}">
                    <div class="card-header">
                        <span class="card-title">
                            <span class="card-title-en">${title}</span>
                            <span class="card-title-ar" id="${cardId}-title-ar">${arTitle}</span>
                        </span>
                        ${translateBtn}
                    </div>
                    <ul class="${listClass}">
                        ${itemsHTML}
                    </ul>
                </div>
            `;
        }

        function cardWithItems(title, items, arTitle = '') {
            const formatted = items.map(item => {
                if (typeof item === 'string') {
                    return { en: item, ar: '' };
                }
                return item;
            });
            return card(title, formatted, arTitle, true);
        }

        function tableCard(title, tableHTML, arTitle = '') {
            const cardId = 'tc' + Math.random().toString(36).substr(2, 8);
            return `
                <div class="topic-card full-width" data-card="${cardId}">
                    <div class="card-header">
                        <span class="card-title">
                            <span class="card-title-en">${title}</span>
                            <span class="card-title-ar" id="${cardId}-title-ar">${arTitle}</span>
                        </span>
                    </div>
                    <div class="info-table-wrap">${tableHTML}</div>
                </div>
            `;
        }

        function cell(en, ar) {
            return `<span class="en-text">${en}</span><span class="ar-text">${ar}</span>`;
        }

        function toggleCardTranslation(cardId) {
            const card = document.querySelector(`.topic-card[data-card="${cardId}"]`);
            if (!card) return;
            const arItems = card.querySelectorAll('.item-ar');
            const titleAr = document.getElementById(`${cardId}-title-ar`);
            const titleEn = card.querySelector('.card-title-en');
            const btn = card.querySelector('.translate-btn');
            
            const isVisible = arItems.length > 0 && arItems[0].classList.contains('show');

            arItems.forEach(el => {
                el.classList.toggle('show');
            });

            if (titleAr) {
                titleAr.classList.toggle('show');
                if (titleEn) {
                    titleEn.classList.toggle('hidden');
                }
            }

            if (btn) {
                btn.textContent = isVisible ? '📖 ترجمة هذا الجزء' : '✕ إخفاء الترجمة';
                btn.classList.toggle('active');
            }
        }

        // ================================================================
        //  SLIDES DATA — COMPLETE BIOCHEMISTRY (MERGED WITH MISSING POINTS)
        // ================================================================

        // ================================================================
        // 1. VITAMINS
        // ================================================================
        const vitaminsData = {
            titleEn: 'Vitamins',
            titleAr: 'الفيتامينات',
            slides: [

                        tableCard(

        // ================================================================
        // 5. THERAPEUTIC DIET (No missing points, kept as is)
        // ================================================================
        const therapeuticData = {
            titleEn: 'Therapeutic Diet',
            titleAr: 'النظام الغذائي العلاجي',
            slides: [
                {
                    title: 'Definition and Methods · تعريف وطرق',
                    cards: [
                        cardWithItems('Definition:', [
                            { en: 'Use of diet as a <span class="highlight-text">therapeutic tool</span> in disease management', ar: 'استخدام النظام الغذائي كـ <span class="highlight-text">أداة علاجية</span> في إدارة الأمراض' }
                        ], 'التعريف:'),
                        cardWithItems('Special feeding methods:', [
                            { en: 'Oral feeding', ar: 'التغذية الفموية' },

                            { en: 'Gastrostomy or jejunostomy', ar: 'التغذية عبر فتحة المعدة أو الصائم' },

                    title: 'Symptoms Relieved by Dietary Modifications · الأعراض التي تخفف بالتعديلات الغذائية',

                        tableCard(

                            `
                            <table class="info-table">

                                    <tr><td>${cell('Chronic constipation, diarrhea', 'إمساك مزمن، إسهال مزمن')}</td><td>${cell('High fiber, bland, high energy', 'ألياف عالية، لطيف، طاقة عالية')}</td></tr>
                                </tbody>

                            'الأعراض والتوصيات'
                        )
                    ]
                },
                {
                    title: 'Gastrointestinal Tract Diseases · أمراض الجهاز الهضمي',
                    cards: [
                        cardWithItems('Peptic ulcer (bland diet):', [
                            { en: 'Soft, <span class="highlight-text">small frequent meals</span>, avoid spices, smoking, alcohol, coffee', ar: 'طعام طري، <span class="highlight-text">وجبات صغيرة متكررة</span>، تجنب البهارات، التدخين، الكحول، القهوة' }
                        ], 'القرحة الهضمية (نظام لطيف):'),
                        cardWithItems('Diarrhea:', [
                            { en: 'Correct water and electrolytes with <span class="highlight-text">oral rehydration solution</span>; 2-hourly diluted milk; later broth, fruits, jelly', ar: 'تصحيح الماء والكهارل بـ <span class="highlight-text">محلول معالجة الجفاف الفموي</span>؛ حليب مخفف كل ساعتين؛ لاحقاً مرق، فواكه، جيلي' }
                        ], 'الإسهال:')
                    ]
                },
                {
                    title: 'Liver, Biliary Tract and Pancreas Diseases · أمراض الكبد والقنوات الصفراوية والبنكرياس',
                    cards: [
                        cardWithItems('Acute hepatitis:', [
                            { en: 'Several small meals, <span class="highlight-text">restrict fat if jaundice</span>, avoid alcohol/spices/fried foods, adequate fruits/veg', ar: 'وجبات صغيرة متعددة، <span class="highlight-text">تقييد الدهون إذا كان اليرقان شديداً</span>، تجنب الكحول/البهارات/المقليات، فواكه/خضروات كافية' }
                        ], 'التهاب الكبد الحاد:'),
                        cardWithItems('Acute cholecystitis:', [
                            { en: '<span class="highlight-text">Fluid diet</span> 2-3 L/day, small feeds, exclude fat; later clear soups, milk, cereals', ar: '<span class="highlight-text">نظام سائل</span> 2-3 لتر/يوم، وجبات صغيرة، استبعاد الدهون؛ لاحقاً شوربات صافية، حليب، حبوب' }
                        ], 'التهاب المرارة الحاد:')
                    ]
                },
                {
                    title: 'Cardiovascular Diseases · أمراض القلب والأوعية الدموية',
                    cards: [
                        cardWithItems('Hypertension:', [
                            { en: 'If overweight, <span class="highlight-text">dietary restriction</span> lowers BP; <span class="highlight-text">salt restriction</span>, relaxation', ar: 'إذا كان يعاني من زيادة الوزن، <span class="highlight-text">التقييد الغذائي</span> يخفض الضغط؛ <span class="highlight-text">تقييد الملح</span>، استرخاء' }
                        ], 'ارتفاع ضغط الدم:'),
                        cardWithItems('Heart failure:', [
                            { en: '<span class="highlight-text">Low sodium diet</span>, no fluid restriction (1.5-2 L/day), small easily digestible meals, potassium supplement if diuretic', ar: '<span class="highlight-text">نظام منخفض الصوديوم</span>، لا تقييد للسوائل (1.5-2 لتر/يوم)، وجبات صغيرة سهلة الهضم، مكمل بوتاسيوم إذا كان مدر بول' }
                        ], 'فشل القلب:')
                    ]
                },
                {
                    title: 'Kidney and Urinary Tract Diseases · أمراض الكلى والجهاز البولي',
                    cards: [
                        cardWithItems('Acute glomerulonephritis:', [
                            { en: 'Restrict fluids to <span class="highlight-text">urine volume + 500 ml</span>, restrict sodium (40-60 mmol/day), restrict protein to 40 g/day if urea high', ar: 'تقييد السوائل إلى <span class="highlight-text">حجم البول + 500 مل</span>، تقييد الصوديوم (40-60 مليمول/يوم)، تقييد البروتين إلى 40 غم/يوم إذا كان اليوريا مرتفعاً' }

                            { en: 'Drink <span class="highlight-text">2-5 L urine/day</span>, reduce purine for uric acid stones', ar: 'شرب <span class="highlight-text">2-5 لتر بول/يوم</span>، تقليل البيورينات لحصوات حمض اليوريك' }

                    ]
                },
                {
                    title: 'Burns and Diabetes · الحروق ومرض السكري',
                    cards: [
                        cardWithItems('Burns:', [
                            { en: '<span class="highlight-text">High calorie and high protein</span> diet; ample fluids, milk shakes, cream soups frequently', ar: 'نظام <span class="highlight-text">عالي السعرات وعالي البروتين</span>؛ سوائل وفيرة، مخفوق حليب، شوربات كريمية متكررة' }
                        ], 'الحروق:'),
                        cardWithItems('Type I diabetes:', [
                            { en: '<span class="highlight-text">Regular meal pattern</span> matched to insulin; avoid fasting/missing meals', ar: '<span class="highlight-text">نمط وجبات منتظم</span> متناسب مع الأنسولين؛ تجنب الصيام/تفويت وجبة' }
                        ], 'السكري النوع الأول:'),
                        cardWithItems('Type II diabetes:', [
                            { en: 'Obese patients: <span class="highlight-text">restrict energy</span> to maintain ideal weight', ar: 'المرضى البدينون: <span class="highlight-text">تقييد الطاقة</span> للحفاظ على الوزن المثالي' }
                        ], 'السكري النوع الثاني:'),
                        cardWithItems('General diabetic diet:', [
                            { en: 'Energy proportions: <span class="highlight-text">carbs 50-55%, protein 10-15%, fat <35%</span>', ar: 'نسب الطاقة: <span class="highlight-text">كربوهيدرات 50-55%، بروتين 10-15%، دهون <35%</span>' }
                        ], 'النظام الغذائي العام لمرضى السكري:')
                    ]
                }
            ]
        };

        // ================================================================
        //  BUILD SECTIONS — ORDER: 1.Vitamins, 2.Minerals, 3.Nutrition, 4.Protein, 5.Therapeutic
        // ================================================================
        const slidesData = {
            vitamins: vitaminsData,
            minerals: mineralsData,
            nutrition: nutritionData,
            protein: proteinData,
            therapeutic: therapeuticData
        };

        const sectionOrder = ['vitamins', 'minerals', 'nutrition', 'protein', 'therapeutic'];

        function renderSlideContent(slide) {
            if (slide.cards && Array.isArray(slide.cards)) {
                const cardsHTML = slide.cards.join('');
                return createSlideHTML(slide.title, cardsHTML);
            }
            return createSlideHTML(slide.title, '');
        }

        function buildApp() {
            const tabsContainer = document.getElementById('tabsContainer');
            const sectionsContainer = document.getElementById('sectionsContainer');

            sectionOrder.forEach((secId, idx) => {
                const sec = slidesData[secId];
                if (!sec) return;

                const tab = document.createElement('button');
                tab.className = 'tab-btn' + (idx === 0 ? ' active' : '');
                tab.dataset.idx = idx;
                tab.innerHTML = `<span class="en">${sec.titleEn}</span><span class="ar">${sec.titleAr}</span>`;
                tab.onclick = () => switchSection(idx);
                tabsContainer.appendChild(tab);

                const card = document.createElement('div');
                card.className = 'card' + (idx === 0 ? ' active' : '');
                card.dataset.idx = idx;
                card.id = `section-${secId}`;

                const slidesHTML = sec.slides.map(s => renderSlideContent(s)).join('');
                const totalSlides = sec.slides.length;

                const cardHTML = `
                        <h2><i class="fas fa-layer-group"></i> ${sec.titleEn} · ${sec.titleAr}</h2>
                        <div class="slide-container" id="slideContainer-${secId}">
                            <div class="slide-progress">
                                <span style="font-weight:600;">التقدم</span>
                                <div class="bar"><div class="fill" style="width:0%;"></div></div>
                                <span class="count">1 / ${totalSlides}</span>
                            </div>
                            ${slidesHTML}
                            <div class="slide-nav">
                                <button class="btn-nav prev" onclick="goToSlide('${secId}', 'slideContainer-${secId}', slideState['${secId}'].current - 1)">السابق</button>
                                <button class="btn-nav next primary" onclick="goToSlide('${secId}', 'slideContainer-${secId}', slideState['${secId}'].current + 1)">التالي</button>
                            </div>
                        </div>
                    `;
                card.innerHTML = cardHTML;
                sectionsContainer.appendChild(card);

                initSlideState(secId, totalSlides);
                setTimeout(() => renderSlide(secId, `slideContainer-${secId}`), 50);
            });
        }

        function switchSection(idx) {
            const secId = sectionOrder[idx];
            document.querySelectorAll('.tab-btn').forEach((tab, i) => tab.classList.toggle('active', i === idx));
            document.querySelectorAll('.card').forEach((card, i) => card.classList.toggle('active', i === idx));
            if (secId && slideState[secId]) {
                slideState[secId].current = 0;
                setTimeout(() => renderSlide(secId, `slideContainer-${secId}`), 50);
            }
        }

        // ================================================================
        //  INIT
        // ================================================================
        applyTheme(localStorage.getItem('theme') || 'dark');
        buildApp();

        window.goToSlide = goToSlide;
        window.slideState = slideState;
        window.switchSection = switchSection;
        window.toggleTheme = toggleTheme;
        window.toggleCardTranslation = toggleCardTranslation;
    </script>
</body>
</html>
